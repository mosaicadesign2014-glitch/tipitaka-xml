name: Build TH1 slot 25 v4 - Mohavicchedani

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder files from this fork
        uses: actions/checkout@v4

      - name: Checkout pinned official VRI CST XML
        uses: actions/checkout@v4
        with:
          repository: VipassanaTech/tipitaka-xml
          ref: e064d02da2db3df9a7d116a9191092b12e6dfe01
          path: upstream/vri
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact VRI commit and Moh source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git -C upstream/vri rev-parse HEAD)"
          echo "VRI commit: $SHA"
          test "$SHA" = "e064d02da2db3df9a7d116a9191092b12e6dfe01"
          test -f upstream/vri/romn/abh09t.nrf.xml
          sha256sum upstream/vri/romn/abh09t.nrf.xml

      - name: Build slot 25 v4 with Mohavicchedani
        shell: bash
        run: |
          python scripts/build_th1_slot25_v4_mohavicchedani.py \
            upstream/vri \
            --output build/slot25-v4

      - name: Independent integrity checks
        shell: bash
        run: |
          set -euo pipefail
          FILE="build/slot25-v4/25_ABHIDHAMMA_TIKA_MANUALS.txt"
          AUDIT="build/slot25-v4/MOHAVICCHEDANI_C3B_EXTRACTION_AUDIT.txt"
          MANIFEST="build/slot25-v4/PASS_C3B_MANIFEST.txt"

          test -f "$FILE"
          test -f "$AUDIT"
          test -f "$MANIFEST"

          test "$(grep -c '^BEGIN_SOURCE$' "$FILE")" -eq 10
          test "$(grep -c '^SOURCE_FILE: derived/vri/abh09t.nrf.xml#Mohavicchedanī$' "$FILE")" -eq 1
          test "$(grep -c '^WORK: Mohavicchedanī$' "$FILE")" -eq 1
          test "$(grep -c '^WORK: Rūpārūpavibhāga$' "$FILE")" -eq 1

          grep -Fq 'EXCLUDED_PREFIX: Abhidhammamātikāpāḷi derived compilation' "$FILE"
          grep -Fq 'Kāruññabhāvitaṃ' "$FILE" || grep -Fq 'Karuṇābhāvitaṃ' "$FILE"
          grep -Fq 'Mohavicchedaniṃ nāma' "$FILE" || grep -Fq 'Mohavicchedani nāma' "$FILE"
          grep -Fq 'Paṭṭhānamātik' "$FILE"
          grep -Fq 'niṭṭhitā' "$FILE"

          # Protect C2-B5.
          grep -Fq 'Upacaya-santatiyo (catūhi ?) jāyantīti vuccanti.' "$FILE"
          grep -Fq '(Na arūpakasattānaṃ paṭisandhikāle na' "$FILE"
          grep -Fq 'saddo viyāti (?).' "$FILE"

          # The extracted Moh block itself must not contain the derived-prefix explicit.
          python - <<'PY'
from pathlib import Path
t=Path("build/slot25-v4/25_ABHIDHAMMA_TIKA_MANUALS.txt").read_text(encoding="utf-8")
start=t.index("SOURCE_FILE: derived/vri/abh09t.nrf.xml#Mohavicchedanī")
moh=t[start:]
assert "Abhidhammamātikāpāḷi niṭṭhitā" not in moh
assert moh.count("WORK: Mohavicchedanī") == 1
print("Derived-prefix exclusion check PASS")
PY

          sha256sum "$FILE" > build/slot25-v4/ARTIFACT_SHA256SUMS.txt
          sha256sum "$AUDIT" >> build/slot25-v4/ARTIFACT_SHA256SUMS.txt
          sha256sum "$MANIFEST" >> build/slot25-v4/ARTIFACT_SHA256SUMS.txt

          echo "PASS C3-B independent integrity checks passed."

      - name: Upload slot 25 v4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TH1_slot25_v4_Mohavicchedani
          path: build/slot25-v4/
          if-no-files-found: error
          retention-days: 90
